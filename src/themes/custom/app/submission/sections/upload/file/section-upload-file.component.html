@if (fileData) {
  <div class="pcirn-submission-file">
    <div class="pcirn-submission-file-primary" [title]="isPrimary ? 'Miniatura / Arquivo Principal da publicação' : 'Marcar para usar este arquivo como miniatura / principal'">
      <div class="form-check form-switch text-center">
        <input
          type="checkbox"
          class="form-check-input"
          id="primaryBitstream{{fileIndex}}"
          [disabled]="processingSaveStatus$ | async"
          [checked]="isPrimary"
          (change)="togglePrimaryBitstream($event)">
        <label class="form-check-label d-block small mt-1" for="primaryBitstream{{fileIndex}}">
          @if (isPrimary) {
            <span class="badge bg-success pcirn-thumbnail-active-badge">
              <i class="fas fa-check me-1" aria-hidden="true"></i>Miniatura
            </span>
          }
          @if (!isPrimary) {
            <span class="text-muted pcirn-thumbnail-toggle-hint">
              Miniatura
            </span>
          }
          <span class="sr-only">{{ (isPrimary ? 'submission.sections.upload.primary.remove' : 'submission.sections.upload.primary.make') | translate:{ fileName: fileName } }}</span>
        </label>
      </div>
    </div>
    <div class="pcirn-submission-file-main">
      <div class="pcirn-submission-file-info">
        @if (isPrimary) {
          <div class="pcirn-primary-thumbnail-notice mb-1">
            <span class="badge pcirn-badge-thumbnail-tag me-2">
              <i class="fas fa-image me-1" aria-hidden="true"></i> Capa / Miniatura da Publicação
            </span>
            <small class="text-muted">A 1ª página deste documento será puxada automaticamente como miniatura.</small>
          </div>
        }
        <ds-submission-section-upload-file-view [fileData]="fileData"></ds-submission-section-upload-file-view>
      </div>
      <div class="pcirn-submission-file-actions">
        <ds-file-download-link [cssClasses]="'btn btn-link-focus'" [isBlank]="true"
          [bitstream]="getBitstream()" [enableRequestACopy]="false" [showAccessStatusBadge]="false">
          <i class="fa fa-download fa-2x text-normal" aria-hidden="true"></i>
        </ds-file-download-link>
        <button class="btn btn-link-focus"
                attr.aria-label="{{'submission.sections.upload.edit.title' | translate}} {{fileName}}"
                title="{{ 'submission.sections.upload.edit.title' | translate }} {{fileName}}"
          (click)="$event.preventDefault();editBitstreamData();">
          <i class="fa fa-edit fa-2x text-normal"></i>
        </button>
        <button class="btn btn-link-focus"
          attr.aria-label="{{'submission.sections.upload.delete.confirm.title' | translate}} {{fileName}}"
                title="{{ 'submission.sections.upload.delete.confirm.title' | translate }} {{fileName}}"
          [dsBtnDisabled]="(processingDelete$ | async)"
          (click)="$event.preventDefault();confirmDelete(content);">
          @if ((processingDelete$ | async)) {
            <i class="fas fa-circle-notch fa-spin fa-2x link-danger"></i>
          }
          @if ((processingDelete$ | async) !== true) {
            <i class="fa fa-trash fa-2x link-danger"></i>
          }
        </button>
      </div>
    </div>
  </div>
}

<ng-template #content let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title text-danger">{{ 'submission.sections.upload.delete.confirm.title' | translate }}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="d('cancel')">
    </button>
  </div>
  <div class="modal-body">
    <p>{{ 'submission.sections.upload.delete.confirm.info' | translate }}</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary"
    (click)="c('cancel')">{{ 'submission.sections.upload.delete.confirm.cancel' | translate }}</button>
    <button type="button" class="btn btn-danger"
    (click)="c('ok')">{{ 'submission.sections.upload.delete.confirm.submit' | translate }}</button>
  </div>
</ng-template>
