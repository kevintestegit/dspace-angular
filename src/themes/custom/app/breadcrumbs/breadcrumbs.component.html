<ng-container *ngVar="(breadcrumbs$ | async) as breadcrumbs">
  @if (showBreadcrumbs$ | async) {
    <nav aria-label="breadcrumb" class="pcirn-breadcrumb" [ngClass]="pcirnSurface">
      <ol class="container breadcrumb my-0">
        <ng-container
          *ngTemplateOutlet="breadcrumbs?.length > 0 ? breadcrumb : activeBreadcrumb; context: {text: 'home.breadcrumbs', url: '/'}">
        </ng-container>
        @for (bc of breadcrumbs; track bc; let last = $last) {
          <ng-container *ngTemplateOutlet="!last ? breadcrumb : activeBreadcrumb; context: bc"></ng-container>
        }
      </ol>
    </nav>
  }

  <ng-template #breadcrumb let-text="text" let-url="url">
    <li class="breadcrumb-item">
      <div class="breadcrumb-item-limiter">
        <a [routerLink]="url" class="text-truncate" [ngbTooltip]="text | translate" placement="bottom" role="link" tabindex="0">
          @if (text === 'home.breadcrumbs') {
            <i class="fas fa-house" aria-hidden="true"></i>
          }
          <span>{{ text | translate }}</span>
        </a>
      </div>
    </li>
  </ng-template>

  <ng-template #activeBreadcrumb let-text="text">
    <li class="breadcrumb-item active" aria-current="page">
      <div class="breadcrumb-item-limiter">
        <div class="text-truncate">{{ text | translate }}</div>
      </div>
    </li>
  </ng-template>
</ng-container>
