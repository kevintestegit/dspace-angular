<div class="pcirn-account-email">
  <span class="pcirn-account-email__label">{{ 'profile.metadata.form.label.email' | translate }}</span>
  <span class="pcirn-account-email__value">
    <i class="fas fa-lock" aria-hidden="true"></i>{{ user?.email }}
  </span>
  <span class="pcirn-account-email__hint">{{ 'profile.metadata.form.hint.email' | translate }}</span>
</div>
@if (formModel) {
  <ds-form
    [formId]="'profile-page-metadata-form-id'"
    [formModel]="formModel"
    [formGroup]="formGroup"
    [displaySubmit]="false"
    [displayCancel]="false">
  </ds-form>
}
