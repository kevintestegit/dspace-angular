<nav [ngClass]="{'open': (menuCollapsed | async) !== true}"
  [@slideMobileNav]="(isMobile$ | async) !== true ? 'default' : ((menuCollapsed | async) ? 'collapsed' : 'expanded')"
  class="navbar navbar-light navbar-expand-md px-md-0 navbar-container" role="navigation"
  [attr.aria-label]="'nav.main.description' | translate" id="main-navbar">
  <!-- TODO remove navbar-container class when https://github.com/twbs/bootstrap/issues/24726 is fixed -->
  <div class="navbar-inner-container w-100" [class.container]="(isMobile$ | async) !== true">
    <div class="w-100">
      <div id="collapsingNav">
        @if ((isMobile$ | async) && (isAuthenticated$ | async)) {
          <ds-user-menu [inExpandableNavbar]="true"></ds-user-menu>
        }
        <div class="navbar-nav align-items-md-center me-auto shadow-none gapx-3" role="menubar">
          <a class="pcirn-header-logo-link" routerLink="/home" role="button" tabindex="0">
            <img class="pcirn-header-logo" src="assets/pcirn/images/brasao-policia-cientifica-rn.png" [attr.alt]="'menu.header.image.logo' | translate"/>
            <span class="pcirn-header-brand"><span>Repositório Institucional da</span><strong>PCIRN</strong></span>
          </a>
          <a class="pcirn-header-nav-link active" routerLink="/home">Início</a>
          <a class="pcirn-header-nav-link" routerLink="/community-list">Comunidades</a>
          <a class="pcirn-header-nav-link" routerLink="/community-list">Coleções</a>
          <a class="pcirn-header-nav-link" routerLink="/search">Publicações</a>
        </div>
      </div>
    </div>
  </div>
</nav>
